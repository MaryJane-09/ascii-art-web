<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Web</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="{{if eq .Theme "dark"}}dark{{else}}light{{end}}">

    <div class="container">

        <header>
            <h1>ASCII Art Web</h1>
        </header>

        <div class="form-container">

            <!-- Main Form -->
            <form id="art-form" action="/ascii-art" method="POST">

                <textarea
                    name="input"
                    placeholder="Enter text here..."
                    required>{{.Input}}</textarea>

                <select name="banner">
                    <option value="" disabled {{if eq .Banner ""}}selected{{end}}>
                        Select a banner
                    </option>

                    <option value="standard.txt" {{if eq .Banner "standard.txt"}}selected{{end}}>
                        Standard
                    </option>

                    <option value="shadow.txt" {{if eq .Banner "shadow.txt"}}selected{{end}}>
                        Shadow
                    </option>

                    <option value="thinkertoy.txt" {{if eq .Banner "thinkertoy.txt"}}selected{{end}}>
                        Thinkertoy
                    </option>
                </select>

                <div class="buttons">

                    <button type="submit" name="action" value="generate">
                        Generate
                    </button>

                    <div class="extras">

                        <!-- Theme -->
                        <div class="themes">

                            <div class="toggle-row">

                                <img src="/static/sun.png" alt="Sun">

                                <label class="switch">
                                    <input
                                        form="theme-form"
                                        type="checkbox"
                                        name="theme"
                                        value="dark"
                                        {{if eq .Theme "dark"}}checked{{end}}>
                                    <span class="slider"></span>
                                </label>

                                <img src="/static/moon.svg" alt="Moon">

                            </div>

                            <button
                                form="theme-form"
                                type="submit"
                                name="action"
                                value="apply"
                                class="link-btn">
                                Apply
                            </button>

                        </div>

                        <!-- Export -->
                        <div class="tool">

                            <img src="/static/export.png" alt="Export">

                            <button
                                type="submit"
                                name="action"
                                value="export"
                                class="link-btn">
                                Export
                            </button>

                        </div>

                        <!-- Test All -->
                        <div class="tool">

                            <img src="/static/testall.png" alt="Test all">

                            <button
                                type="submit"
                                name="action"
                                value="testall"
                                class="link-btn">
                                Test all
                            </button>

                        </div>

                    </div>

                </div>

            </form>

           <!-- Theme Form -->
            <form id="theme-form" action="/ascii-art" method="POST"></form>

        </div>
 
        {{if .Error}}
        <div class="error">
            <h2>{{.Error}}</h2>
        </div>
        {{end}}

        {{if .Result}}
        <div class="result">
            <pre>{{.Result}}</pre>
        </div>
        {{end}}

        {{if .TestResult}}
        <div class="result">
            {{range .TestResult}}
            <h3> {{.Name}} </h3>
            <pre>{{.Art}}</pre>
            {{end}}
        </div>
        {{end}}

        <footer>
            Built by MJ
        </footer>

    </div>

</body>

</html>
