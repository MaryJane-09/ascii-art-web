<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Web</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
    min-height: 100vh;
    padding: 40px;

    background:
        linear-gradient(
            rgba(7,11,32,0.65),
            rgba(7,11,32,0.85)
        ),
        url("/static/sunset.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: white;
}

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 92, 168, 0.08),
                    transparent 50%
                );

            pointer-events: none;
        }
            

        .container {
            max-width: 1400px;
            margin: auto;
        }


        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
    font-size: 5rem;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        #ff76c8,
        #c85cff,
        #7d6bff,
        #69b7ff
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 15px rgba(255,118,200,0.4),
        0 0 30px rgba(200,92,255,0.3),
        0 0 60px rgba(105,183,255,0.2);
}

        header p {
            margin-top: 10px;
            color: #d8d8ff;
            /* font-size: 1.1rem; */
        }

        .form-container {
    width: 70%;

    margin: 0 auto 60px auto;

    position: relative;

    padding: 35px;

    background: rgba(15,20,60,0.75);

    backdrop-filter: blur(18px);

    border-radius: 25px;

    border: 1px solid rgba(255,92,168,0.3);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.55),
        0 0 40px rgba(255,92,168,0.15),
        0 0 80px rgba(79,125,255,0.1);

    transition: all 0.3s ease;
}

.form-container:hover {
    transform: translateY(-3px);
}

            .form-container::after {
        content: "";

        position: absolute;

        left: 10%;
        right: 10%;
        bottom: -20px;

        height: 25px;

        background: rgba(138, 92, 255, 0.2);

        filter: blur(25px);

        z-index: -1;
    }

            form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

        textarea {
    width: 100%;

    min-height: 180px;

    resize: vertical;

    padding: 18px;

    border-radius: 16px;

    background: rgba(7,11,32,0.8);

    border: 1px solid rgba(255,118,200,0.4);

    color: white;

    font-size: 18px;

    font-family: Consolas, monospace;

    outline: none;
}
        textarea:focus {
            box-shadow:
                0 0 15px rgba(255,118,200,0.25);
        }

        select {
    width: 320px;

    padding: 14px;

    border-radius: 14px;

    background: rgba(7,11,32,0.8);

    color: white;

    border: 1px solid rgba(125,107,255,0.4);
}

        button {
    width: 320px;

    padding: 15px;

    border: none;

    border-radius: 14px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #ff5ca8,
            #b14cff,
            #4f7dff
        );

    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 20px rgba(255,92,168,0.4),
        0 0 40px rgba(79,125,255,0.3);
}

        .error {
            text-align: center;
            margin-top: 25px;
        }

        .error h2 {
            color: #ff9abf;
        }

        .result {
    width: fit-content;

    max-width: 95%;

    margin: auto;

    padding: 35px;

    overflow-x: auto;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            #150f42,
            #0d1b52
        );

    border: 1px solid rgba(255,92,168,0.4);

    box-shadow:
        0 0 25px rgba(255,92,168,0.25),
        0 0 60px rgba(79,125,255,0.15);
}

        .result pre {
    margin: 0;

    color: #ffffff;

    font-family: Consolas, monospace;

    white-space: pre;

    text-shadow:
        0 0 5px rgba(255,92,168,0.3),
        0 0 15px rgba(105,183,255,0.3);
}

        footer {
    text-align: center;

    margin-top: 40px;

    color: #d8d8ff;

    font-size: 15px;
}

footer span {
    color: #ff76c8;
    font-weight: bold;
}

    @media (max-width: 768px) {

        body {
            padding: 20px;
        }

        header h1 {
            font-size: 2.5rem;
        }

        .form-container {
            width: 100%;
        }

        button,
        select {
            width: 100%;
        }

        .result {
            max-width: 100%;
        }
    }

    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>ASCII Art Web</h1>
            <p>Transform your text into stunning ASCII art</p>
        </header>

        <div class="form-container">

            <form action="/ascii-art" method="POST">

                <textarea
                    name="input"
                    placeholder="Enter text here..."
                >{{.Input}}</textarea>

                <select name="banner" required>
                    <option value="" disabled>Select a banner</option>

                    <option value="standard.txt"
                        {{if eq .Banner "standard.txt"}}selected{{end}}>
                        Standard
                    </option>

                    <option value="shadow.txt"
                        {{if eq .Banner "shadow.txt"}}selected{{end}}>
                        Shadow
                    </option>

                    <option value="thinkertoy.txt"
                        {{if eq .Banner "thinkertoy.txt"}}selected{{end}}>
                        Thinkertoy
                    </option>
                </select>

                <button type="submit">
                    Generate
                </button>

            </form>

        </div>

        {{if .Error}}
        <div class="error">
            <h2>{{.Error}}</h2>
        </div>
        {{end}}

        {{if .Result}}
        <div class="result">
            <pre>{{.Result}}</pre>
        </div>
        {{end}}

        <footer>
            Built by <span>MJ</span>
        </footer>

    </div>

</body>
</html>
